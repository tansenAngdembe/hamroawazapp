# Gradle JVM heap — keep modest on 8GB RAM machines (was -Xmx8G + 4G metaspace → OOM crash).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Reduce peak memory and avoid Kotlin daemon cache clashes on low-RAM PCs.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=true
org.gradle.caching=true

# Kotlin: in-process compile is more stable when Gradle workers are limited.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
